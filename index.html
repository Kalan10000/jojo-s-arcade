<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Arcade Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      background-color: #050505;
      color: #fff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Top HUD / Auth Overlay */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ffcc;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }

    #hud h1 {
      font-size: 1.2rem;
      color: #00ffcc;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .btn {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      border-radius: 4px;
    }

    .btn:hover {
      background: #ff00ff;
      color: #fff;
    }

    /* Cabinet Info Sidebar */
    #cabinet-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #ff00ff;
      padding: 20px;
      border-radius: 8px;
      display: none;
      width: 300px;
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
    }

    #cabinet-panel h2 {
      color: #ff00ff;
      margin-bottom: 10px;
    }

    /* Embedded Game Iframe Overlay */
    #game-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-modal-header {
      width: 90%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #game-modal-title {
      color: #00ffcc;
      font-size: 1.5rem;
    }

    #close-game-btn {
      background: #ff0055;
      color: white;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }

    #game-iframe {
      width: 90%;
      height: 80vh;
      max-width: 1000px;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
      background: #000;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <!-- HUD Header -->
  <div id="hud">
    <h1>Arcade Hub</h1>
    <div id="auth-status">Checking auth...</div>
    <button id="login-btn" class="btn" onclick="promptLogin()">Log In</button>
    <button id="logout-btn" class="btn" onclick="logoutUser()" style="display:none;">Log Out</button>
  </div>

  <!-- Cabinet Interaction Panel -->
  <div id="cabinet-panel">
    <h2 id="cabinet-title">Cabinet Name</h2>
    <p>High Score: <span id="cabinet-high-score">0</span></p>
    <br>
    <button id="play-btn" class="btn">Play Game</button>
    <button class="btn" style="background:#666; color:#fff;" onclick="closePanel()">Cancel</button>
  </div>

  <!-- Game Iframe Screen -->
  <div id="game-modal">
    <div id="game-modal-header">
      <span id="game-modal-title">Playing Arcade Game</span>
      <button id="close-game-btn" onclick="closeGameModal()">Exit Cabinet</button>
    </div>
    <iframe id="game-iframe" src="" frameborder="0" allowfullscreen></iframe>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="auth.js"></script>

  <script>
    // Arcade Cabinets Metadata
    const cabinetsData = [
      { id: 0, title: "Labyrinthe à Jojo", url: "https://labyrintheajojo.vercel.app" },
      { id: 1, title: "Tour Infinie", url: "https://tourinfinie.vercel.app" }
    ];

    let scene, camera, renderer;
    let cabinets = [];
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let selectedCabinet = null;

    function init3DArcade() {
      const container = document.getElementById('webgl-canvas');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050505);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 8);

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x00ffcc, 1, 15);
      pointLight.position.set(0, 5, 2);
      scene.add(pointLight);

      // Simple Arcade Cabinet Geometries
      cabinetsData.forEach((data, index) => {
        const geometry = new THREE.BoxGeometry(1.5, 3, 1.5);
        const material = new THREE.MeshPhongMaterial({ 
          color: index === 0 ? 0x00ffcc : 0xff00ff 
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set((index - 0.5) * 3, 0, 0);
        mesh.userData = data;
        
        scene.add(mesh);
        cabinets.push(mesh);
      });

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onCabinetClick);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      cabinets.forEach(cab => { cab.rotation.y += 0.005; });
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onCabinetClick(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cabinets);

      if (intersects.length > 0) {
        selectedCabinet = intersects[0].object.userData;
        openPanel(selectedCabinet);
      }
    }

    function openPanel(cabinet) {
      const scores = getScores();
      document.getElementById('cabinet-title').textContent = cabinet.title;
      document.getElementById('cabinet-high-score').textContent = scores[cabinet.id] || 0;
      
      const playBtn = document.getElementById('play-btn');
      playBtn.onclick = () => launchGame(cabinet);

      document.getElementById('cabinet-panel').style.display = 'block';
    }

    function closePanel() {
      document.getElementById('cabinet-panel').style.display = 'none';
    }

    function launchGame(cabinet) {
      closePanel();
      window.activeArcadeGameId = cabinet.id;
      
      const iframe = document.getElementById('game-iframe');
      iframe.src = cabinet.url;
      
      document.getElementById('game-modal-title').textContent = cabinet.title;
      document.getElementById('game-modal').style.display = 'flex';
    }

    function closeGameModal() {
      const iframe = document.getElementById('game-iframe');
      iframe.src = ''; // Stop game execution
      document.getElementById('game-modal').style.display = 'none';
      window.activeArcadeGameId = null;
      renderHighScores();
    }

    function promptLogin() {
      const name = prompt("Enter your Arcade Username:");
      if (name) {
        setCurrentUser(name);
      }
    }

    window.onload = init3DArcade;
  </script>
</body>
</html>
