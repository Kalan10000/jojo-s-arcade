<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOJO'S ARCADE</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #040208;
            color: #ffffff;
            user-select: none;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-pixel { font-family: 'Press Start 2P', monospace; }

        .glass-panel {
            background: rgba(10, 8, 20, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        @keyframes reticleLock {
            0% { transform: translate(-50%, -50%) scale(1); border-color: rgba(0, 240, 255, 0.8); }
            50% { transform: translate(-50%, -50%) scale(1.3); border-color: rgba(255, 0, 127, 1); }
            100% { transform: translate(-50%, -50%) scale(1); border-color: rgba(0, 240, 255, 0.8); }
        }

        .reticle-locked {
            animation: reticleLock 0.8s infinite ease-in-out;
            background-color: rgba(0, 240, 255, 0.6) !important;
        }
    </style>
</head>
<body class="h-full w-full relative overflow-hidden bg-black select-none">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-crosshair"></div>

    <!-- FPS Reticle -->
    <div id="crosshair" class="pointer-events-none fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-30 w-3 h-3 rounded-full border border-cyan-400 bg-cyan-400/20 transition-all duration-150"></div>

    <!-- Minimal Instruction Banner -->
    <div id="click-hint-banner" class="fixed top-5 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-opacity duration-500">
        <div class="glass-panel px-5 py-2 rounded-xl border border-slate-700 shadow-lg flex items-center space-x-3 text-xs font-orbitron">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span class="text-cyan-300 font-bold">CLICK SCENE TO CONTROL</span>
            <span class="text-slate-600">|</span>
            <span class="text-slate-300"><i class="fa-solid fa-keyboard mr-1"></i> WASD to walk</span>
        </div>
    </div>

    <!-- TARGET CABINET HUD DISPLAY -->
    <div id="hud-prompt" class="pointer-events-none fixed top-1/2 left-1/2 -translate-x-1/2 translate-y-8 z-30 opacity-0 transition-all duration-200 transform scale-95 glass-panel px-6 py-3.5 rounded-2xl border border-cyan-500/50 shadow-2xl text-center">
        <div class="flex items-center justify-center space-x-2 mb-1">
            <span id="hud-category" class="px-2.5 py-0.5 rounded-full text-[10px] font-orbitron uppercase tracking-wider bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">GENRE</span>
        </div>
        <h3 id="hud-title" class="font-orbitron font-extrabold text-lg md:text-xl text-white">GAME TITLE</h3>
        <p id="hud-url" class="text-xs font-mono text-cyan-300/80 truncate max-w-xs mb-2.5">https://example.com</p>
        <div id="hud-button-badge" class="inline-flex items-center space-x-2 bg-pink-600/40 px-3.5 py-1 rounded-lg border border-pink-500/50 text-pink-200 text-[11px] font-orbitron">
            <i class="fa-solid fa-arrow-pointer text-xs"></i>
            <span id="hud-action-text">CLICK OR PRESS [E] TO LAUNCH</span>
        </div>
    </div>

    <!-- Audio Synth Control Button -->
    <div class="fixed bottom-5 right-5 z-30">
        <button id="btn-audio" onclick="toggleAudio()" class="px-4 py-2.5 rounded-xl glass-panel text-slate-300 hover:text-cyan-300 border border-slate-700/80 hover:border-cyan-500/60 transition shadow-md flex items-center space-x-2 text-xs font-orbitron">
            <i id="audio-icon" class="fa-solid fa-volume-xmark text-pink-400 text-sm"></i>
            <span id="audio-text" class="hidden sm:inline">SYNTH MUSIC [M]</span>
        </button>
    </div>

    <script>
        const MAIN_ARCADE_CONFIGS = [
            { id: 0, title: "LABYRINTHE", category: "3D Labyrinth", url: "https://labyrintheajojo.vercel.app/", color: "#ff0055" },
            { id: 1, title: "TOUR INFINIE", category: "Tour infinie", url: "https://tourinfinie.vercel.app", color: "#00f3ff" },
            { id: 2, title: "NEON OVERDRIVE", category: "Neon overdrive", url: "https://neonoverdrive.vercel.app", color: "#39ff14" },
            { id: 3, title: "SPACIAL MASTER", category: "Spacial master", url: "https://spacialmaster.vercel.app", color: "#bf00ff" },
            { id: 4, title: "LA JUSTE COULEUR", category: "La juste couleur", url: "https://lajustecouleur.vercel.app", color: "#ffcc00" },
            { id: 5, title: "SANDWICH", category: "Simulateur de sandwich", url: "https://simulateursandwich.vercel.app", color: "#ff00aa" }
        ];

        const SECRET_CABINET_CONFIG = {
            id: 99,
            title: "KALAN'S GAMES",
            category: "VINTAGE CLASSIC",
            url: "https://kalansgames.vercel.app/",
            color: "#ffaa00",
            isSecret: true
        };

        const totalRows = Math.ceil(MAIN_ARCADE_CONFIGS.length / 2);
        const rowSpacing = 4.0;
        const firstRowZ = 3.0;
        const lastRowZ = firstRowZ + (totalRows - 1) * rowSpacing;
        
        const frontZ = lastRowZ + 4.0;
        const backWallZ = -1.0;
        const secretRoomZ = -5.0;
        const hallLength = frontZ - backWallZ; // Exact length so main floor ends right at backWallZ
        const hallCenterZ = (frontZ + backWallZ) / 2;

        let scene, camera, renderer;
        let arcadeCabinets = [];
        let raycaster, centerRayVector;

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let isPointerLocked = false;

        let pitch = 0;
        let yaw = 0;
        const playerPos = new THREE.Vector3(0, 1.13, frontZ - 1.5);
        const playerRadius = 0.35;
        const walkSpeed = 5.5;

        let targetInteractable = null;

        let exitDoor = {
            group: null,
            pivotGroup: null,
            panelMesh: null,
            isOpen: false,
            targetRotation: 0,
            currentRotation: 0,
            isExit: true
        };
        let isExiting = false;

        let audioCtx = null;
        let isAudioPlaying = false;
        let synthTimer = null;

        function generateRealisticWoodCanvas(width = 512, height = 512) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#2e1406');
            grad.addColorStop(0.5, '#1b0a02');
            grad.addColorStop(1, '#381a08');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < 400; i++) {
                const x = Math.random() * width;
                const w = Math.random() * 2 + 0.5;
                const alpha = Math.random() * 0.12 + 0.03;
                ctx.fillStyle = Math.random() > 0.5 ? `rgba(10, 4, 1, ${alpha})` : `rgba(70, 36, 14, ${alpha})`;
                ctx.fillRect(x, 0, w, height);
            }

            ctx.lineWidth = 1.8;
            for (let g = 0; g < 30; g++) {
                const startX = (g / 30) * width + (Math.random() * 10 - 5);
                const alpha = Math.random() * 0.15 + 0.05;
                ctx.strokeStyle = `rgba(12, 5, 1, ${alpha})`;
                ctx.beginPath();
                ctx.moveTo(startX, 0);

                for (let y = 0; y <= height; y += 10) {
                    const shift = Math.sin(y * 0.01) * 12 + Math.cos(y * 0.02) * 4;
                    ctx.lineTo(startX + shift, y);
                }
                ctx.stroke();
            }

            return canvas;
        }

        function init3DScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05030a);
            scene.fog = new THREE.FogExp2(0x05030a, 0.018);

            camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.copy(playerPos);

            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            centerRayVector = new THREE.Vector2(0, 0);

            setupLighting();
            setupMainHall();
            setupSecretRoom();
            setupExitDoor();

            buildMainCabinets();
            buildSecretCabinet();

            setupFPSControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0x8070a0, 0x201535, 1.35);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfff0e6, 0.85);
            dirLight.position.set(0, 10, 4);
            scene.add(dirLight);

            const lightCount = Math.max(2, totalRows);
            for (let i = 0; i < lightCount; i++) {
                const zPos = 3.0 + i * 4.0;
                const color = i % 2 === 0 ? 0x00f0ff : 0xff007f;
                const pLight = new THREE.PointLight(color, 0.75, 14);
                pLight.position.set(0, 4.8, zPos);
                scene.add(pLight);
            }

            const secretRoomLight = new THREE.PointLight(0xffaa44, 1.2, 9);
            secretRoomLight.position.set(-6.5, 3.2, secretRoomZ);
            scene.add(secretRoomLight);
        }

        function setupMainHall() {
            const floorGeo = new THREE.PlaneGeometry(15, hallLength);

            const tileCanvas = document.createElement('canvas');
            tileCanvas.width = 512;
            tileCanvas.height = 512;
            const tCtx = tileCanvas.getContext('2d');

            tCtx.fillStyle = '#0a0714';
            tCtx.fillRect(0, 0, 512, 512);
            tCtx.strokeStyle = 'rgba(255, 0, 127, 0.22)';
            tCtx.lineWidth = 3;

            for (let i = 0; i <= 512; i += 64) {
                tCtx.beginPath(); tCtx.moveTo(i, 0); tCtx.lineTo(i, 512); tCtx.stroke();
                tCtx.beginPath(); tCtx.moveTo(0, i); tCtx.lineTo(512, i); tCtx.stroke();
            }

            const floorTex = new THREE.CanvasTexture(tileCanvas);
            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(7.5, hallLength / 2);

            const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.35, metalness: 0.25 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, 0, hallCenterZ);
            scene.add(floor);

            const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x090612, roughness: 0.8 });
            const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, 5.2, hallCenterZ);
            scene.add(ceiling);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x0f0b1a, roughness: 0.7 });

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5.2, hallLength), wallMat);
            leftWall.position.set(-7.5, 2.6, hallCenterZ);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5.2, hallLength), wallMat);
            rightWall.position.set(7.5, 2.6, hallCenterZ);
            scene.add(rightWall);

            const frontWallLeft = new THREE.Mesh(new THREE.BoxGeometry(6.6, 5.2, 0.3), wallMat);
            frontWallLeft.position.set(-4.2, 2.6, frontZ);
            scene.add(frontWallLeft);

            const frontWallRight = new THREE.Mesh(new THREE.BoxGeometry(6.6, 5.2, 0.3), wallMat);
            frontWallRight.position.set(4.2, 2.6, frontZ);
            scene.add(frontWallRight);

            const frontWallTop = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.5, 0.3), wallMat);
            frontWallTop.position.set(0, 3.95, frontZ);
            scene.add(frontWallTop);

            // Solid back wall covering right and center (from x = -2.0 to 7.5)
            const backWallSolid = new THREE.Mesh(new THREE.BoxGeometry(9.5, 5.2, 0.3), wallMat);
            backWallSolid.position.set(2.75, 2.6, backWallZ);
            scene.add(backWallSolid);

            // Fake clip-through wall panel covering the left passage (x = -7.5 to -2.0)
            // Visually hides secret room, but you can walk right through it!
            const fakeClipWall = new THREE.Mesh(new THREE.BoxGeometry(5.5, 5.2, 0.3), wallMat);
            fakeClipWall.position.set(-4.75, 2.6, backWallZ);
            scene.add(fakeClipWall);

            createCleanSign(1.5, 3.8, backWallZ + 0.18, Math.PI);
        }

        function setupExitDoor() {
            const doorGroup = new THREE.Group();
            doorGroup.position.set(0, 0, frontZ);

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x151221, roughness: 0.4, metalness: 0.8 });
            const frameL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.6, 0.15), frameMat);
            frameL.position.set(-0.82, 1.3, 0);
            doorGroup.add(frameL);

            const frameR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.6, 0.15), frameMat);
            frameR.position.set(0.82, 1.3, 0);
            doorGroup.add(frameR);

            const frameTop = new THREE.Mesh(new THREE.BoxGeometry(1.76, 0.12, 0.15), frameMat);
            frameTop.position.set(0, 2.54, 0);
            doorGroup.add(frameTop);

            const pivotGroup = new THREE.Group();
            pivotGroup.position.set(-0.76, 1.25, 0);

            const doorMat = new THREE.MeshStandardMaterial({
                color: 0x220b1b,
                roughness: 0.3,
                metalness: 0.5,
                emissive: 0x44001a,
                emissiveIntensity: 0.35
            });
            const panelMesh = new THREE.Mesh(new THREE.BoxGeometry(1.52, 2.45, 0.08), doorMat);
            panelMesh.position.set(0.76, 0, 0);
            panelMesh.userData = { isExitDoor: true };
            pivotGroup.add(panelMesh);

            const handleMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.9, roughness: 0.1, emissive: 0xff0055, emissiveIntensity: 0.6 });
            const handleBar = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.06, 0.08), handleMat);
            handleBar.position.set(0.76, 0, -0.06);
            pivotGroup.add(handleBar);

            doorGroup.add(pivotGroup);

            const exitCanvas = document.createElement('canvas');
            exitCanvas.width = 512;
            exitCanvas.height = 128;
            const ctx = exitCanvas.getContext('2d');
            ctx.fillStyle = '#0a0208';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 8;
            ctx.strokeRect(6, 6, 500, 116);

            ctx.fillStyle = '#ff0055';
            ctx.font = '900 46px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('EXIT ARCADE', 256, 78);

            const exitTex = new THREE.CanvasTexture(exitCanvas);
            const signMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(1.6, 0.45),
                new THREE.MeshBasicMaterial({ map: exitTex })
            );
            signMesh.position.set(0, 2.9, 0.01);
            signMesh.rotation.y = Math.PI;
            doorGroup.add(signMesh);

            const exitLight = new THREE.PointLight(0xff0055, 1.4, 6);
            exitLight.position.set(0, 2.7, 0.4);
            doorGroup.add(exitLight);

            scene.add(doorGroup);

            exitDoor.group = doorGroup;
            exitDoor.pivotGroup = pivotGroup;
            exitDoor.panelMesh = panelMesh;
        }

        function setupSecretRoom() {
            const woodCanvas = generateRealisticWoodCanvas(512, 512);
            const woodTex = new THREE.CanvasTexture(woodCanvas);
            woodTex.wrapS = THREE.RepeatWrapping;
            woodTex.wrapT = THREE.RepeatWrapping;
            woodTex.repeat.set(3, 3);

            const secretFloorMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.5 });
            // Slightly offset secret floor height (-0.002) to guarantee zero Z-fighting at floor boundary
            const secretFloor = new THREE.Mesh(new THREE.PlaneGeometry(9, 7.98), secretFloorMat);
            secretFloor.rotation.x = -Math.PI / 2;
            secretFloor.position.set(-6.5, -0.002, secretRoomZ - 0.01);
            scene.add(secretFloor);

            const secretCeilingMat = new THREE.MeshStandardMaterial({ color: 0x1f1107, roughness: 0.9 });
            const secretCeiling = new THREE.Mesh(new THREE.PlaneGeometry(9, 8), secretCeilingMat);
            secretCeiling.rotation.x = Math.PI / 2;
            secretCeiling.position.set(-6.5, 4.2, secretRoomZ);
            scene.add(secretCeiling);

            const paperCanvas = document.createElement('canvas');
            paperCanvas.width = 256;
            paperCanvas.height = 256;
            const pCtx = paperCanvas.getContext('2d');
            pCtx.fillStyle = '#221107';
            pCtx.fillRect(0, 0, 256, 256);
            pCtx.fillStyle = '#180a03';
            for (let x = 0; x < 256; x += 32) {
                pCtx.fillRect(x, 0, 16, 256);
            }

            const paperTex = new THREE.CanvasTexture(paperCanvas);
            paperTex.wrapS = THREE.RepeatWrapping;
            paperTex.wrapT = THREE.RepeatWrapping;
            paperTex.repeat.set(4, 2);

            const secretWallMat = new THREE.MeshStandardMaterial({ map: paperTex, roughness: 0.7 });

            const secretBack = new THREE.Mesh(new THREE.BoxGeometry(9.0, 4.2, 0.3), secretWallMat);
            secretBack.position.set(-6.5, 2.1, -9.0);
            scene.add(secretBack);

            const secretLeft = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.2, 8.0), secretWallMat);
            secretLeft.position.set(-11.0, 2.1, secretRoomZ);
            scene.add(secretLeft);

            const secretRight = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4.2, 8.0), secretWallMat);
            secretRight.position.set(-2.0, 2.1, secretRoomZ);
            scene.add(secretRight);
        }

        function createCleanSign(x, y, z, rotY) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#080512';
            ctx.fillRect(0, 0, 1024, 256);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 76px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("JOJO'S ARCADE", 512, 110);

            ctx.fillStyle = '#ff007f';
            ctx.font = '700 30px "Orbitron", sans-serif';
            ctx.fillText('SELECT A CABINET TO LAUNCH PORTAL', 512, 185);

            const signTex = new THREE.CanvasTexture(canvas);
            const signMat = new THREE.MeshBasicMaterial({ map: signTex, transparent: true });
            const signMesh = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), signMat);
            signMesh.position.set(x, y, z);
            signMesh.rotation.y = rotY;
            scene.add(signMesh);
        }

        function buildMainCabinets() {
            MAIN_ARCADE_CONFIGS.forEach((data, index) => {
                const isLeft = index % 2 === 0;
                const row = Math.floor(index / 2);

                const posX = isLeft ? -5.5 : 5.5;
                const posZ = firstRowZ + (row * rowSpacing);
                const rotY = isLeft ? Math.PI / 2.4 : -Math.PI / 2.4;

                const cabinetData = createRealisticCabinetMesh(data, false);
                const group = cabinetData.group;

                group.position.set(posX, 0, posZ);
                group.rotation.y = rotY;
                scene.add(group);

                arcadeCabinets.push({
                    id: data.id,
                    config: data,
                    group: group,
                    screenMesh: cabinetData.screenMesh,
                    screenCanvas: cabinetData.screenCanvas,
                    screenCtx: cabinetData.screenCtx,
                    minX: posX - 0.55,
                    maxX: posX + 0.55,
                    minZ: posZ - 0.55,
                    maxZ: posZ + 0.55
                });
            });
        }

        function buildSecretCabinet() {
            const posX = -6.5;
            const posZ = -7.5;

            const cabinetData = createRealisticCabinetMesh(SECRET_CABINET_CONFIG, true);
            const group = cabinetData.group;

            group.position.set(posX, 0, posZ);
            group.rotation.y = 0; 
            scene.add(group);

            arcadeCabinets.push({
                id: SECRET_CABINET_CONFIG.id,
                config: SECRET_CABINET_CONFIG,
                group: group,
                screenMesh: cabinetData.screenMesh,
                screenCanvas: cabinetData.screenCanvas,
                screenCtx: cabinetData.screenCtx,
                minX: posX - 0.55,
                maxX: posX + 0.55,
                minZ: posZ - 0.55,
                maxZ: posZ + 0.55
            });
        }

        function createRealisticCabinetMesh(data, isWood) {
            const group = new THREE.Group();
            const mainColorHex = parseInt(data.color.replace('#', '0x'));

            let bodyMat;
            if (isWood) {
                const woodCanvas = generateRealisticWoodCanvas(512, 512);
                const woodTexture = new THREE.CanvasTexture(woodCanvas);
                bodyMat = new THREE.MeshStandardMaterial({ map: woodTexture, roughness: 0.45, metalness: 0.1 });
            } else {
                bodyMat = new THREE.MeshStandardMaterial({ color: 0x201a30, roughness: 0.35, metalness: 0.2 });
            }

            const trimMat = new THREE.MeshStandardMaterial({
                color: isWood ? 0x2d1d11 : mainColorHex,
                roughness: 0.2,
                metalness: 0.8,
                emissive: isWood ? 0x000000 : mainColorHex,
                emissiveIntensity: isWood ? 0.0 : 0.25
            });

            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.85, 2.05, 0.80), bodyMat);
            bodyMesh.position.y = 1.025;
            group.add(bodyMesh);

            const trimL = new THREE.Mesh(new THREE.BoxGeometry(0.03, 2.06, 0.03), trimMat);
            trimL.position.set(-0.43, 1.025, 0.405);
            group.add(trimL);

            const trimR = new THREE.Mesh(new THREE.BoxGeometry(0.03, 2.06, 0.03), trimMat);
            trimR.position.set(0.43, 1.025, 0.405);
            group.add(trimR);

            const screenFrame = new THREE.Mesh(
                new THREE.BoxGeometry(0.72, 0.58, 0.15),
                new THREE.MeshStandardMaterial({ color: 0x110e1a, roughness: 0.5 })
            );
            screenFrame.position.set(0, 1.35, 0.35);
            screenFrame.rotation.x = -0.22;
            group.add(screenFrame);

            const screenCanvas = document.createElement('canvas');
            screenCanvas.width = 512;
            screenCanvas.height = 384;
            const screenCtx = screenCanvas.getContext('2d');

            const screenTexture = new THREE.CanvasTexture(screenCanvas);
            const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });

            const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.52), screenMat);
            screenMesh.position.set(0, 1.35, 0.43);
            screenMesh.rotation.x = -0.22;
            group.add(screenMesh);

            screenMesh.userData = { cabinetId: data.id };
            bodyMesh.userData = { cabinetId: data.id };

            const marqueeCanvas = document.createElement('canvas');
            marqueeCanvas.width = 512;
            marqueeCanvas.height = 128;
            const mCtx = marqueeCanvas.getContext('2d');

            if (isWood) {
                const mGrad = mCtx.createLinearGradient(0, 0, 0, 128);
                mGrad.addColorStop(0, '#ffe0a0');
                mGrad.addColorStop(0.5, '#ffaa00');
                mGrad.addColorStop(1, '#cc6600');
                mCtx.fillStyle = mGrad;
                mCtx.fillRect(0, 0, 512, 128);

                mCtx.strokeStyle = '#221100';
                mCtx.lineWidth = 10;
                mCtx.strokeRect(5, 5, 502, 118);

                mCtx.fillStyle = '#110500';
                mCtx.font = '30px "Press Start 2P"';
                mCtx.textAlign = 'center';
                mCtx.fillText("KALAN'S", 256, 54);
                mCtx.fillStyle = '#ffffff';
                mCtx.font = '24px "Press Start 2P"';
                mCtx.fillText("GAMES", 256, 100);
            } else {
                mCtx.fillStyle = '#0a0514';
                mCtx.fillRect(0, 0, 512, 128);
                mCtx.strokeStyle = data.color;
                mCtx.lineWidth = 8;
                mCtx.strokeRect(4, 4, 504, 120);

                mCtx.fillStyle = '#ffffff';
                mCtx.font = 'bold 38px "Orbitron", sans-serif';
                mCtx.textAlign = 'center';
                mCtx.fillText(data.title, 256, 76);
            }

            const marqueeTexture = new THREE.CanvasTexture(marqueeCanvas);
            const marqueeMesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.81, 0.28, 0.16),
                new THREE.MeshBasicMaterial({ map: marqueeTexture })
            );
            marqueeMesh.position.set(0, 1.84, 0.38);
            group.add(marqueeMesh);

            const deck = new THREE.Mesh(new THREE.BoxGeometry(0.81, 0.10, 0.38), bodyMat);
            deck.position.set(0, 0.95, 0.44);
            deck.rotation.x = 0.15;
            group.add(deck);

            const stickGroup = new THREE.Group();
            const washer = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.01, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            washer.position.y = 0.005;
            stickGroup.add(washer);

            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.10, 16), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.95, roughness: 0.1 }));
            shaft.position.y = 0.055;
            stickGroup.add(shaft);

            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), new THREE.MeshStandardMaterial({
                color: isWood ? 0xcc1100 : mainColorHex,
                roughness: 0.2
            }));
            ball.position.y = 0.105;
            stickGroup.add(ball);

            stickGroup.position.set(-0.22, 1.0, 0.44);
            group.add(stickGroup);

            const buttonColors = [0xdd1100, 0x0088ff, 0xffcc00, 0x00cc44, 0xff00aa, 0xffffff];
            let bIdx = 0;
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 3; col++) {
                    const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.02, 16), new THREE.MeshStandardMaterial({
                        color: buttonColors[bIdx % buttonColors.length],
                        roughness: 0.3
                    }));
                    btn.position.set(0.04 + col * 0.065, 0.995 + row * 0.01, 0.40 + row * 0.065);
                    btn.rotation.x = 0.15;
                    group.add(btn);
                    bIdx++;
                }
            }

            const doorFrame = new THREE.Mesh(
                new THREE.BoxGeometry(0.40, 0.46, 0.04),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.3 })
            );
            doorFrame.position.set(0, 0.48, 0.41);
            group.add(doorFrame);

            for (let c = -1; c <= 1; c += 2) {
                const coinBtn = new THREE.Mesh(
                    new THREE.BoxGeometry(0.05, 0.04, 0.02),
                    new THREE.MeshStandardMaterial({ color: 0xee1100, emissive: 0x990000, emissiveIntensity: 0.6 })
                );
                coinBtn.position.set(c * 0.10, 0.52, 0.435);
                group.add(coinBtn);
            }

            return { group, screenMesh, screenCanvas, screenCtx };
        }

        function updateScreenTextures(time) {
            arcadeCabinets.forEach((cab) => {
                const ctx = cab.screenCtx;
                const width = 512;
                const height = 384;
                const config = cab.config;

                if (config.isSecret) {
                    renderVintagePixelScreen(ctx, width, height, time, config);
                } else {
                    renderArcadeGameScreen(ctx, width, height, time, config);
                }

                cab.screenMesh.material.map.needsUpdate = true;
            });
        }

        function renderArcadeGameScreen(ctx, width, height, time, config) {
            const themeColor = config.color || '#ff007f';

            ctx.fillStyle = '#05020a';
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.4;
            const horizon = height * 0.5;

            for (let x = -width; x <= width * 2; x += 32) {
                ctx.beginPath();
                ctx.moveTo(width / 2, horizon);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            const gridOffset = (time * 50) % 18;
            for (let y = horizon; y < height; y += 10) {
                const drawY = y + gridOffset;
                if (drawY < height) {
                    ctx.beginPath();
                    ctx.moveTo(0, drawY);
                    ctx.lineTo(width, drawY);
                    ctx.stroke();
                }
            }
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = themeColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            const centerY = height * 0.35;
            for (let x = 0; x <= width; x += 6) {
                const wave = Math.sin(x * 0.025 + time * 4) * 20;
                if (x === 0) ctx.moveTo(x, centerY + wave);
                else ctx.lineTo(x, centerY + wave);
            }
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 30px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(config.title, width / 2, height * 0.72);

            ctx.fillStyle = themeColor;
            ctx.font = '600 14px "Orbitron", sans-serif';
            ctx.fillText(config.category.toUpperCase(), width / 2, height * 0.81);

            const blink = Math.sin(time * 5) > 0;
            if (blink) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Orbitron", sans-serif';
                ctx.fillText("▶ CLICK TO LAUNCH PORTAL ◀", width / 2, height * 0.92);
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 2);
            }
        }

        function renderVintagePixelScreen(ctx, width, height, time, config) {
            ctx.fillStyle = '#120a02';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffaa00';
            for (let i = 0; i < 18; i++) {
                const px = (i * 35 + Math.floor(time * 30)) % width;
                const py = (i * 18) % (height * 0.55);
                ctx.fillRect(px, py, 6, 6);
            }

            const shipX = width / 2 + Math.sin(time * 2) * 100;
            const shipY = height * 0.52;

            ctx.fillStyle = '#ff4400';
            ctx.fillRect(shipX - 16, shipY, 32, 10);
            ctx.fillRect(shipX - 6, shipY - 10, 12, 10);

            if (Math.floor(time * 6) % 2 === 0) {
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(shipX - 10, shipY - 28, 4, 14);
                ctx.fillRect(shipX + 6, shipY - 28, 4, 14);
            }

            ctx.fillStyle = '#ffaa00';
            ctx.font = '20px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText("KALAN'S GAMES", width / 2, height * 0.76);

            const blink = Math.sin(time * 4) > 0;
            if (blink) {
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px "Press Start 2P"';
                ctx.fillText("INSERT COIN", width / 2, height * 0.88);
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 2);
            }
        }

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }

        function playSynthBeep(freq = 440, duration = 0.1, type = 'square', volume = 0.08) {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function toggleAudio() {
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isAudioPlaying = !isAudioPlaying;
            const btn = document.getElementById('btn-audio');
            const icon = document.getElementById('audio-icon');

            if (isAudioPlaying) {
                btn.classList.add('border-cyan-500', 'text-cyan-300');
                icon.className = 'fa-solid fa-volume-high text-cyan-400 animate-pulse';
                startSynthTrack();
            } else {
                btn.classList.remove('border-cyan-500', 'text-cyan-300');
                icon.className = 'fa-solid fa-volume-xmark text-pink-400';
                stopSynthTrack();
            }
        }

        function startSynthTrack() {
            if (!audioCtx) return;
            const notes = [110, 110, 130.81, 110, 146.83, 130.81, 98, 110];
            let step = 0;
            
            synthTimer = setInterval(() => {
                if (!isAudioPlaying) return;
                playSynthBeep(notes[step % notes.length], 0.12, 'sawtooth', 0.025);
                step++;
            }, 180);
        }

        function stopSynthTrack() {
            if (synthTimer) clearInterval(synthTimer);
        }

        function setupFPSControls() {
            const hintBanner = document.getElementById('click-hint-banner');

            document.addEventListener('click', (e) => {
                if (e.target.closest('#btn-audio') || isExiting) return;

                if (!isPointerLocked) {
                    document.body.requestPointerLock();
                    initAudio();
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                } else {
                    launchTargetPortal();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isPointerLocked = true;
                    hintBanner.style.opacity = '0';
                } else {
                    isPointerLocked = false;
                    if (!isExiting) hintBanner.style.opacity = '1';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;

                const sensitivity = 0.0022;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;

                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            });

            document.addEventListener('keydown', (e) => {
                if (isExiting) return;
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'KeyM': toggleAudio(); break;
                    case 'KeyE': launchTargetPortal(); break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            });
        }

        function isWalkable(x, z) {
            // Front exit door boundary check
            if (z > frontZ - playerRadius) {
                if (Math.abs(x) < 0.75 && exitDoor.isOpen) return true;
                return false;
            }

            // Main Hall bounds
            const inMainHall = (x >= -7.5 + playerRadius && x <= 7.5 - playerRadius && z >= backWallZ + playerRadius && z <= frontZ - playerRadius);

            // Secret Room & Corridor bounds (includes clipping directly through the fake wall passage around backWallZ)
            const inSecretArea = (x >= -11.0 + playerRadius && x <= -2.0 - playerRadius && z >= -9.0 + playerRadius && z <= backWallZ + playerRadius);

            return inMainHall || inSecretArea;
        }

        function updatePlayerMovement(delta) {
            if (!isPointerLocked || isExiting) return;

            const moveDir = new THREE.Vector3();
            const front = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

            if (moveForward) moveDir.add(front);
            if (moveBackward) moveDir.sub(front);
            if (moveRight) moveDir.add(right);
            if (moveLeft) moveDir.sub(right);

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();

                const nextX = playerPos.x + moveDir.x * walkSpeed * delta;
                const nextZ = playerPos.z + moveDir.z * walkSpeed * delta;

                if (isWalkable(nextX, playerPos.z)) {
                    let hitCabinetX = false;
                    arcadeCabinets.forEach(cab => {
                        if (nextX > cab.minX - playerRadius && nextX < cab.maxX + playerRadius &&
                            playerPos.z > cab.minZ - playerRadius && playerPos.z < cab.maxZ + playerRadius) {
                            hitCabinetX = true;
                        }
                    });
                    if (!hitCabinetX) {
                        playerPos.x = nextX;
                    }
                }

                if (isWalkable(playerPos.x, nextZ)) {
                    let hitCabinetZ = false;
                    arcadeCabinets.forEach(cab => {
                        if (playerPos.x > cab.minX - playerRadius && playerPos.x < cab.maxX + playerRadius &&
                            nextZ > cab.minZ - playerRadius && nextZ < cab.maxZ + playerRadius) {
                            hitCabinetZ = true;
                        }
                    });
                    if (!hitCabinetZ) {
                        playerPos.z = nextZ;
                    }
                }

                if (exitDoor.isOpen && playerPos.z > frontZ - 0.2 && Math.abs(playerPos.x) < 0.75) {
                    exitGame();
                    return;
                }
            }

            camera.position.copy(playerPos);

            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        function updateRaycasting() {
            if (!isPointerLocked || isExiting) {
                hideHUDPrompt();
                targetInteractable = null;
                return;
            }

            raycaster.setFromCamera(centerRayVector, camera);

            const interactables = [];
            arcadeCabinets.forEach(cab => interactables.push(cab.screenMesh));
            if (exitDoor.panelMesh) interactables.push(exitDoor.panelMesh);

            const intersects = raycaster.intersectObjects(interactables);
            const crosshair = document.getElementById('crosshair');

            if (intersects.length > 0 && intersects[0].distance < 4.8) {
                const hitObj = intersects[0].object;

                if (hitObj.userData.isExitDoor) {
                    if (targetInteractable !== exitDoor) {
                        targetInteractable = exitDoor;
                        playSynthBeep(620, 0.05, 'sine', 0.06);
                        showExitDoorHUD();
                    }
                    crosshair.classList.add('reticle-locked');
                    return;
                } else if (hitObj.userData.cabinetId !== undefined) {
                    const cabinet = arcadeCabinets.find(c => c.id === hitObj.userData.cabinetId);
                    if (cabinet) {
                        if (targetInteractable !== cabinet) {
                            targetInteractable = cabinet;
                            playSynthBeep(620, 0.05, 'sine', 0.06);
                            showHUDPrompt(cabinet);
                        }
                        crosshair.classList.add('reticle-locked');
                        return;
                    }
                }
            }

            if (targetInteractable) {
                targetInteractable = null;
                hideHUDPrompt();
            }
            crosshair.classList.remove('reticle-locked');
        }

        function showHUDPrompt(cabinet) {
            const prompt = document.getElementById('hud-prompt');
            const titleEl = document.getElementById('hud-title');

            titleEl.innerText = cabinet.config.title;

            if (cabinet.config.isSecret) {
                titleEl.className = 'font-pixel font-bold text-base md:text-lg text-amber-400 mb-1';
            } else {
                titleEl.className = 'font-orbitron font-extrabold text-lg md:text-xl text-white';
            }

            document.getElementById('hud-url').innerText = cabinet.config.url;
            document.getElementById('hud-category').innerText = cabinet.config.category;
            
            document.getElementById('hud-action-text').innerText = "CLICK OR PRESS [E] TO LAUNCH";

            prompt.style.opacity = '1';
            prompt.style.transform = 'translate(-50%, 0) scale(1)';
        }

        function showExitDoorHUD() {
            const prompt = document.getElementById('hud-prompt');
            const titleEl = document.getElementById('hud-title');

            titleEl.innerText = "EXIT DOOR";
            titleEl.className = 'font-orbitron font-extrabold text-lg md:text-xl text-pink-500';

            document.getElementById('hud-url').innerText = "LEAVE ARCADE & CLOSE TAB";
            document.getElementById('hud-category').innerText = "SYSTEM EXIT";
            
            const actionText = exitDoor.isOpen ? "CLICK/[E] TO CLOSE (WALK THRU TO EXIT)" : "CLICK OR PRESS [E] TO OPEN DOOR";
            document.getElementById('hud-action-text').innerText = actionText;

            prompt.style.opacity = '1';
            prompt.style.transform = 'translate(-50%, 0) scale(1)';
        }

        function hideHUDPrompt() {
            const prompt = document.getElementById('hud-prompt');
            prompt.style.opacity = '0';
            prompt.style.transform = 'translate(-50%, 8px) scale(0.95)';
        }

        function launchTargetPortal() {
            if (targetInteractable) {
                if (targetInteractable.isExit) {
                    exitDoor.isOpen = !exitDoor.isOpen;
                    exitDoor.targetRotation = exitDoor.isOpen ? -Math.PI * 0.52 : 0;
                    playSynthBeep(exitDoor.isOpen ? 520 : 380, 0.15, 'triangle', 0.15);
                    showExitDoorHUD();
                } else if (targetInteractable.config && targetInteractable.config.url) {
                    playSynthBeep(880, 0.15, 'triangle', 0.2);
                    window.location.href = targetInteractable.config.url;
                }
            }
        }

        function exitGame() {
            if (isExiting) return;
            isExiting = true;
            playSynthBeep(300, 0.4, 'sawtooth', 0.2);

            if (document.pointerLockElement) {
                document.exitPointerLock();
            }

            try {
                window.close();
                window.open('', '_self', '');
                window.close();
            } catch (e) {}

            document.body.innerHTML = `
                <div class="h-full w-full bg-[#040208] flex flex-col items-center justify-center text-center p-6 font-orbitron relative overflow-hidden select-none">
                    <div class="absolute inset-0 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.3)_50%)] bg-[length:100%_4px] pointer-events-none"></div>

                    <div class="relative z-10 glass-panel p-8 md:p-12 rounded-3xl border border-pink-500/40 shadow-[0_0_50px_rgba(255,0,127,0.2)] max-w-md w-full">
                        <div class="w-20 h-20 mx-auto rounded-full bg-pink-500/10 border-2 border-pink-500 flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(255,0,127,0.4)]">
                            <i class="fa-solid fa-power-off text-3xl text-pink-500"></i>
                        </div>

                        <h1 class="text-2xl md:text-3xl font-extrabold text-white mb-2 tracking-wider">SYSTEM SHUTDOWN</h1>
                        <p class="text-pink-400 font-mono text-xs uppercase tracking-widest mb-6">Arcade Offline</p>

                        <p class="text-slate-300 text-xs leading-relaxed mb-6">
                            You have exited JoJo's Arcade. You can safely close this browser tab now.
                        </p>

                        <div class="flex flex-col gap-3">
                            <button onclick="location.reload()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 font-orbitron font-bold text-xs rounded-xl transition text-white shadow-lg shadow-cyan-600/30 flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>RE-ENTER ARCADE</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (isExiting) return;

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            if (Math.abs(exitDoor.currentRotation - exitDoor.targetRotation) > 0.001) {
                const diff = exitDoor.targetRotation - exitDoor.currentRotation;
                const step = Math.sign(diff) * delta * 0.55;
                
                if (Math.abs(step) >= Math.abs(diff)) {
                    exitDoor.currentRotation = exitDoor.targetRotation;
                } else {
                    exitDoor.currentRotation += step;
                }
                
                exitDoor.pivotGroup.rotation.y = exitDoor.currentRotation;
            }

            updatePlayerMovement(delta);
            updateRaycasting();
            updateScreenTextures(elapsedTime);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            init3DScene();
        };
    </script>
</body>
</html>
